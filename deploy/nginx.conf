# Общий буфер — https://github.com/vaninanton/clip
#
# Один vhost отдаёт и страницу, и сигнальный релей на /relay. Через релей
# ходят только SDP-офферы и ICE-кандидаты, зашифрованные именем комнаты;
# содержимое буфера передаётся напрямую между браузерами и сюда не попадает.
#
# Один домен вместо двух — сознательно: корпоративная сеть в RDP-сессиях
# не пускает на публичные Nostr-релеи, и чем меньше имён нужно разрешить,
# тем меньше шансов упереться в запрет.
#
# Файл ведётся в репозитории: deploy/nginx.conf

# Имя с префиксом, чтобы не столкнуться с такой же картой в соседнем
# конфиге: nginx считает повторное определение ошибкой.
map $http_upgrade $clip_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name clip.gocpa.ru;

    # Оставлено для продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name clip.gocpa.ru;

    ssl_certificate     /etc/letsencrypt/live/clip.gocpa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clip.gocpa.ru/privkey.pem;

    access_log /var/log/nginx/clip.access.log main;
    error_log  /var/log/nginx/clip.error.log;

    # Файлы в буфер кладут крупные; размер ограничивает только здравый смысл.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $clip_connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Вкладку держат открытой весь рабочий день, а сигналинг между
        # переподключениями молчит. Со стандартной минутой nginx рвал бы
        # соединение, и устройства переставали бы видеть друг друга.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
