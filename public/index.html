<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<style>
  #devices { display: inline-flex; gap: .75em; margin-left: .5em; }
  #devices span { display: inline-flex; gap: .25em; }
</style>
</head>
<body>
<h1 id="room"></h1>
<p><span id="status"></span><span id="devices"></span></p>
<textarea id="clip" rows="20" cols="80" placeholder="вставьте сюда текст"></textarea>

<script type="module">
import {joinRoom, selfId} from 'https://cdn.jsdelivr.net/npm/trystero@0.25.4/+esm'

const clip = document.getElementById('clip')
const status = document.getElementById('status')
const devices = document.getElementById('devices')

// Ключи, а не готовые CSS-классы: то, что приходит от чужого пира, ходит
// только по этим таблицам и никогда не попадает в разметку напрямую.
const BROWSERS = {
  chrome: ['fa-brands fa-chrome', 'Chrome'],
  firefox: ['fa-brands fa-firefox', 'Firefox'],
  safari: ['fa-brands fa-safari', 'Safari'],
  edge: ['fa-brands fa-edge', 'Edge'],
  opera: ['fa-brands fa-opera', 'Opera'],
  other: ['fa-solid fa-globe', 'браузер']
}

const SYSTEMS = {
  windows: ['fa-brands fa-windows', 'Windows'],
  apple: ['fa-brands fa-apple', 'macOS / iOS'],
  linux: ['fa-brands fa-linux', 'Linux'],
  android: ['fa-brands fa-android', 'Android'],
  other: ['fa-solid fa-desktop', 'система']
}

const detect = () => {
  const ua = navigator.userAgent
  return {
    // Порядок важен: Edge и Opera тоже пишут о себе Chrome,
    // а Chrome дополнительно представляется Safari.
    browser:
      /Edg\//.test(ua) ? 'edge' :
      /OPR\/|Opera/.test(ua) ? 'opera' :
      /Firefox\/|FxiOS/.test(ua) ? 'firefox' :
      /Chrome\/|CriOS/.test(ua) ? 'chrome' :
      /Safari\//.test(ua) ? 'safari' : 'other',
    os:
      /Windows/.test(ua) ? 'windows' :
      /Android/.test(ua) ? 'android' :
      /iPhone|iPad|iPod|Macintosh|Mac OS X/.test(ua) ? 'apple' :
      /Linux|X11/.test(ua) ? 'linux' : 'other'
  }
}

const plural = n => {
  if (n % 100 >= 11 && n % 100 <= 14) return 'устройств'
  const last = n % 10
  return last === 1 ? 'устройство' : last >= 2 && last <= 4 ? 'устройства' : 'устройств'
}

const pick = (table, key) => (Object.hasOwn(table, key) ? table[key] : table.other)

const chip = device => {
  const [osClass, osName] = pick(SYSTEMS, device.os)
  const [browserClass, browserName] = pick(BROWSERS, device.browser)
  const el = document.createElement('span')
  el.title = device.self ? `${osName} · ${browserName} — это вы` : `${osName} · ${browserName}`
  for (const cls of [osClass, browserClass]) {
    const icon = document.createElement('i')
    icon.className = cls
    el.append(icon)
  }
  return el
}

const me = detect()
const peers = new Map()

const render = () => {
  const all = [{...me, self: true}, ...peers.values()]
  status.textContent = `подключено ${all.length} ${plural(all.length)}`
  devices.replaceChildren(...all.map(chip))
}

// Секрет живёт во фрагменте URL — на сервер он не уходит.
// Чтобы связать два устройства, открываем на обоих одну и ту же ссылку целиком.
if (!location.hash.slice(1)) {
  location.hash = crypto.randomUUID()
}
const secret = location.hash.slice(1)

// Кириллица и пробелы в адресной строке хранятся процентными кодами,
// поэтому для показа раскодируем, а секретом остаётся фрагмент как есть.
document.getElementById('room').textContent = (() => {
  try {
    return decodeURIComponent(secret)
  } catch {
    return secret
  }
})()

// Имя комнаты — хеш секрета: релей видит идентификатор, но не сам секрет.
const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(secret))
const roomId = [...new Uint8Array(digest)]
  .slice(0, 16)
  .map(b => b.toString(16).padStart(2, '0'))
  .join('')

const room = joinRoom({appId: 'vanton-clipboard', password: secret}, roomId)
const text = room.makeAction('text')
const hello = room.makeAction('hello')

// Программная установка value не порождает input, так что эха не будет.
text.onMessage = value => {
  if (value !== clip.value) clip.value = value
}

hello.onMessage = (device, {peerId}) => {
  if (!peers.has(peerId)) return
  peers.set(peerId, {
    browser: typeof device?.browser === 'string' ? device.browser : 'other',
    os: typeof device?.os === 'string' ? device.os : 'other'
  })
  render()
}

clip.addEventListener('input', () => text.send(clip.value))

room.onPeerJoin = peerId => {
  peers.set(peerId, {browser: 'other', os: 'other'}) // до ответа рисуем заглушки
  render()
  hello.send(me, {target: peerId})
  text.send(clip.value, {target: peerId}) // новичку — текущее состояние
}

room.onPeerLeave = peerId => {
  peers.delete(peerId)
  render()
}

render()
console.log('selfId', selfId, 'room', roomId)
</script>
</body>
</html>
