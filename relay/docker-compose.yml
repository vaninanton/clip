# Релей наружу не смотрит: TLS и апгрейд вебсокета снимает nginx
# на relay.clip.gocpa.ru, сюда приходит уже расшифрованный HTTP.
services:
  relay:
    build: .
    container_name: clip-relay
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
