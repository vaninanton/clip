# Сигнальный релей общего буфера — https://github.com/vaninanton/clip
#
# Через него ходят только SDP-офферы и ICE-кандидаты: содержимое буфера
# передаётся напрямую между браузерами и сюда не попадает. Вдобавок
# сигналинг зашифрован именем комнаты, так что в логах и в памяти
# процесса виден только шифротекст.
#
# Свой релей понадобился потому, что корпоративная сеть в RDP-сессиях
# не пускает на публичные Nostr-релеи (relay.sigit.io и остальные).
#
# Файл ведётся в репозитории: relay/nginx.conf

server {
    listen 80;
    server_name relay.clip.gocpa.ru;

    # Оставлено для продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.clip.gocpa.ru;

    ssl_certificate     /etc/letsencrypt/live/relay.clip.gocpa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.clip.gocpa.ru/privkey.pem;

    access_log /var/log/nginx/clip-relay.access.log main;
    error_log  /var/log/nginx/clip-relay.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Вкладку держат открытой весь рабочий день, а сигналинг между
        # переподключениями молчит. Со стандартной минутой nginx рвал бы
        # соединение, и устройства переставали бы видеть друг друга.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
